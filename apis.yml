name: Urban Engines
description: Urban Engines was a Silicon Valley urban-mobility analytics startup founded by
  Shiva Shivakumar and Balaji Prabhakar that built a Space/Time Engine for analyzing how
  people and objects move through cities, powering commuter routing and congestion insights
  for cities including Washington D.C., Sao Paulo, and Singapore. Backed by a16z and GV, the
  company was acquired by Google in September 2016 and is now defunct; it published no public
  API, developer portal, or client packages, and its former website is parked on Google
  infrastructure.
